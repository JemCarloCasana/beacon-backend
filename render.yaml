services:
  - type: web
    name: beacon-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: BeaconDB
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        value: https://beacon-admin-five.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: ADMIN_FRONTEND_URL
        value: https://beacon-admin-five.vercel.app
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGO_CONNECT_MAX_ATTEMPTS
        value: "20"
      - key: MONGO_CONNECT_BASE_DELAY_MS
        value: "1000"
      - key: BCRYPT_COST
        value: "12"
